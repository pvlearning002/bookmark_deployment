
version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  bookmark_services:
    image: bookmark_service:dev
    build: .
    restart: always
    container_name: bookmark_service
    ports:
      - "8080:8080"
    depends_on:
      - redis
    env_file:
      - .env
